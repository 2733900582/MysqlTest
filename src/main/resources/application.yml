# 方法1: 使用Spring Boot配置多数据源
spring:
  # 确保使用Spring Boot方式，不使用sharding-jdbc profile
  profiles:
    active: default
  # 注释掉下面的shardingsphere配置，取消注释datasource配置，可以使用Spring Boot方式
  datasource:
    master:
      url: jdbc:mysql://yuanbaocat.work:13306/repltest
      username: root
      password: masterpassword
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        idle-timeout: 30000
        connection-timeout: 30000
        max-lifetime: 1800000
    slave:
      url: jdbc:mysql://yuanbaocat.work:13307/repltest
      username: root
      password: slavepassword
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        idle-timeout: 30000
        connection-timeout: 30000
        max-lifetime: 1800000

